server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/connecthub_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 9981
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: GOOGLE_CLIENT_ID
            client-secret: GOOGLE_CLIENT_SECRET
            scope: email, profile
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/{registrationId}"
          github:
            client-id: GITHUB_CLIENT_ID
            client-secret: GITHUB_CLIENT_SECRET
            scope: user:email
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/{registrationId}"

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  cors:
    allowed-origins: "http://localhost:3000,http://localhost:8080"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.connecthub: DEBUG
    org.springframework.security: INFO
