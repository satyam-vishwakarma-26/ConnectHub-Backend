server:
  port: 8084
  servlet:
    context-path: /api

spring:
  application:
    name: media-service

  datasource:
    url: jdbc:mysql://localhost:3306/connecthub_media?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 9981
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 26MB

app:
  jwt:
    # Must match the secret used in auth-service
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

  cors:
    allowed-origins: "http://localhost:3000,http://localhost:8080"

  cloudinary:
    cloud-name: dlc47gsjp
    api-key: 288252612814225
    api-secret: lHdmQcsZ3jnla3KgY_c6cCY4fmg

  media:
    allowed-image-types: image/jpeg,image/png,image/gif,image/webp
    allowed-doc-types: application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/zip
    max-file-size-mb: 25
    thumbnail:
      width: 320
      height: 240
      format: jpg

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: http://admin:connecthub-eureka-secret@localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.connecthub: DEBUG
    org.springframework.security: INFO
    software.amazon.awssdk: WARN
